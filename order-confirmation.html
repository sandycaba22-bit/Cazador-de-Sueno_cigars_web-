<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pedido confirmado — Cazador de Sueños</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/luxury-tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/checkout-onepage.css" />
  </head>

  <body data-page="confirmation">
    <main class="co">
      <header class="co__bar">
        <a class="co__back" href="index.html" data-i18n="confirmation.back">← Volver a la tienda</a>
        <a href="index.html" class="cds-brand co__brand" aria-label="Cazador de Sueños Cigar SRL">
          <img
            src="images/logo.png"
            alt="Cazador de Sueños"
            class="cds-brand__mark site-logo site-logo--compact"
            width="339"
            height="256"
            decoding="async"
          />
        </a>
        <div class="nav__tools">
          <div class="lang-selector">
            <button type="button" class="lang-selector__button" aria-label="Seleccionar idioma">
              <svg class="lang-selector__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              <span class="lang-selector__current">ES</span>
            </button>
          </div>
          <span class="co__secure" data-i18n="confirmation.secure">Pedido registrado</span>
        </div>
      </header>

      <div id="oc-content" class="co-summary-card">
        <p data-i18n="confirmation.loading">Cargando confirmación…</p>
      </div>
    </main>

    <script src="js/language-switcher.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/policies.js" defer></script>
    <script>
      /**
       * La confirmación lee el pedido del servidor, no de sessionStorage.
       * La referencia por sí sola no basta: hace falta el token de acceso que
       * el servidor emitió al crear el pedido, para que nadie pueda enumerar
       * referencias ajenas y leer datos personales de otros clientes.
       */
      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('oc-content');
        const params = new URLSearchParams(window.location.search);
        const reference = params.get('ref');
        const accessToken = params.get('t');

        function tt(path, fallback) {
          try {
            if (typeof LanguageSwitcher !== 'undefined' && typeof LanguageSwitcher.t === 'function') {
              const value = LanguageSwitcher.t(path);
              if (typeof value === 'string' && value) return value;
            }
          } catch (_) {
            /* ignore */
          }
          return fallback;
        }

        const money = (cents, currency) => {
          const lang =
            typeof LanguageSwitcher !== 'undefined' && LanguageSwitcher.getCurrentLanguage
              ? LanguageSwitcher.getCurrentLanguage()
              : 'es';
          const locale = lang === 'en' ? 'en-US' : 'es-DO';
          return new Intl.NumberFormat(locale, {
            style: 'currency',
            currency: currency || 'USD',
            minimumFractionDigits: 2,
          }).format((Number(cents) || 0) / 100);
        };

        const safe = (value) => {
          const div = document.createElement('div');
          div.textContent = value == null ? '' : String(value);
          return div.innerHTML;
        };

        function notFound(message) {
          container.innerHTML = `
            <h1>${safe(tt('confirmation.not_found_title', 'No encontramos ese pedido'))}</h1>
            <p>${safe(message)}</p>
            <a href="index.html" class="co-btn co-btn--gold">${safe(
              tt('confirmation.home_cta', 'Volver al inicio')
            )}</a>`;
        }

        if (!reference || !accessToken) {
          notFound(
            tt(
              'confirmation.incomplete_link',
              'El enlace de confirmación está incompleto. Revisa el correo que te enviamos.'
            )
          );
          return;
        }

        let order;
        try {
          const response = await fetch(
            `/api/commerce/orders/${encodeURIComponent(reference)}?t=${encodeURIComponent(accessToken)}`
          );
          if (!response.ok) throw new Error('no disponible');
          order = await response.json();
        } catch {
          notFound(
            tt(
              'confirmation.fetch_fail',
              'No pudimos recuperar los detalles ahora mismo. Si completaste el pago, revisa tu correo o escríbenos por WhatsApp con tu referencia.'
            )
          );
          return;
        }

        const isBank = order.paymentMethod === 'bank_transfer';
        const isPaid = order.paymentStatus === 'paid';

        function renderOrder() {
          const items = order.items
            .map(
              (item) =>
                `<li><strong>${safe(item.name)}</strong> — ${safe(item.displayLabel)} · ${money(item.lineTotalCents, order.currency)}</li>`
            )
            .join('');

          const bank = order.bankTransfer
            ? `
          <div class="co-bank">
            <h2>${safe(tt('confirmation.transfer', 'Transferencia'))}</h2>
            <p class="co-note">
              ${safe(tt('confirmation.concept', 'Concepto:'))} <strong>${safe(order.reference)}</strong>
              · ${safe(tt('confirmation.amount', 'Monto:'))} <strong>${money(order.totalCents, order.currency)}</strong>
            </p>
            <div class="co-bank__region">
              <h3 class="co-bank__region-title">${safe(tt('confirmation.accounts', 'Cuentas'))}</h3>
              ${(order.bankTransfer.accounts || [])
                .map(
                  (account) => `
                <div class="co-bank__account">
                  <p class="co-bank__bank">${safe(account.bankName)}</p>
                  <dl>
                    <div><dt>${safe(tt('confirmation.holder', 'Titular'))}</dt><dd>${safe(account.accountHolder)}</dd></div>
                    <div><dt>${safe(tt('confirmation.type', 'Tipo'))}</dt><dd>${safe(account.accountType)}</dd></div>
                    <div><dt>${safe(tt('confirmation.account', 'Cuenta'))}</dt><dd><code>${safe(account.accountNumber)}</code></dd></div>
                  </dl>
                </div>`
                )
                .join('')}
            </div>
            <a
              id="oc-bank-whatsapp"
              class="co-btn co-btn--whatsapp co-btn--block"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >${safe(tt('confirmation.whatsapp_receipt', 'Enviar comprobante por WhatsApp'))}</a>
          </div>`
            : '';

          const title = isPaid
            ? tt('confirmation.paid_title', 'Pago confirmado')
            : isBank
              ? tt('confirmation.bank_title', 'Pedido reservado — falta la transferencia')
              : tt('confirmation.registered_title', 'Pedido registrado');

          container.innerHTML = `
          <h1>${safe(title)}</h1>
          <p class="co-note">${safe(tt('confirmation.reference', 'Referencia:'))} <strong>${safe(order.reference)}</strong></p>

          <ul class="co-meta">
            <li><span>${safe(tt('confirmation.status', 'Estado'))}</span><strong>${safe(order.status)}</strong></li>
            <li><span>${safe(tt('confirmation.destination', 'Destino'))}</span><strong>${safe(order.shipping.countryName)} · ${safe(order.shipping.city)}</strong></li>
            <li><span>${safe(tt('confirmation.carrier', 'Transportista'))}</span><strong>${safe(order.shipping.carrier)}</strong></li>
            <li><span>${safe(tt('confirmation.boxes', 'Cajas'))}</span><strong>${safe(order.shipping.boxes)}</strong></li>
            <li><span>${safe(tt('confirmation.eta', 'Entrega estimada'))}</span><strong>${safe(order.shipping.estimatedDays)} ${safe(tt('confirmation.days', 'días'))}</strong></li>
          </ul>

          <ul class="co-items">${items}</ul>

          <dl class="co-totals">
            <div><dt>${safe(tt('confirmation.subtotal', 'Subtotal'))}</dt><dd>${money(order.subtotalCents, order.currency)}</dd></div>
            <div><dt>${safe(tt('confirmation.shipping_dhl', 'Envío DHL'))}</dt><dd>${money(order.shippingCents, order.currency)}</dd></div>
            <div class="co-totals__grand"><dt>${safe(tt('confirmation.total', 'Total'))}</dt><dd>${money(order.totalCents, order.currency)}</dd></div>
          </dl>

          ${bank}

          <div class="co-warn" role="note">
            <strong>${safe(tt('confirmation.final_sale', 'Venta final — sin devoluciones ni reembolsos.'))}</strong>
            <p>${safe(typeof SALES_POLICY !== 'undefined' ? SALES_POLICY.legalNotice : '')}</p>
          </div>

          <div class="co-submit">
            ${
              isBank
                ? ''
                : `<button type="button" id="oc-whatsapp" class="co-btn co-btn--gold co-btn--block">${safe(
                    tt('confirmation.whatsapp_generic', 'Escribirnos por WhatsApp')
                  )}</button>`
            }
            <a href="index.html" class="co-btn co-btn--ghost co-btn--block">${safe(
              tt('confirmation.continue', 'Seguir comprando')
            )}</a>
          </div>`;

          const phone =
            (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.whatsapp && APP_CONFIG.whatsapp.phone) ||
            '18094645016';
          const waText = [
            `${tt('confirmation.wa_order', 'Pedido')} ${order.reference}`,
            `${tt('confirmation.wa_total', 'Total:')} ${money(order.totalCents, order.currency)}`,
            isBank
              ? tt('confirmation.wa_bank_note', 'Adjunto el comprobante de la transferencia bancaria.')
              : '',
          ]
            .filter(Boolean)
            .join('\n');
          const waUrl = `https://wa.me/${String(phone).replace(/\D/g, '')}?text=${encodeURIComponent(waText)}`;

          const bankWa = document.getElementById('oc-bank-whatsapp');
          if (bankWa) bankWa.href = waUrl;

          const genericWa = document.getElementById('oc-whatsapp');
          if (genericWa) {
            genericWa.addEventListener('click', () => {
              window.open(waUrl, '_blank', 'noopener');
            });
          }
        }

        renderOrder();
        window.addEventListener('cds:language-changed', renderOrder);
      });
    </script>
  </body>
</html>
