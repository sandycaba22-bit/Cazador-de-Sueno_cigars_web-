<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pedido confirmado — Cazador de Sueños</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/luxury-tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/checkout-onepage.css" />
  </head>

  <body data-page="confirmation">
    <main class="co">
      <header class="co__bar">
        <a class="co__back" href="index.html">← Volver a la tienda</a>
        <a href="index.html" class="cds-brand co__brand" aria-label="Cazador de Sueños Cigar SRL">
          <img
            src="images/logo.png"
            alt="Cazador de Sueños"
            class="cds-brand__mark site-logo site-logo--compact"
            width="339"
            height="256"
            decoding="async"
          />
        </a>
        <div class="nav__tools">
          <div class="lang-selector">
            <button type="button" class="lang-selector__button" aria-label="Seleccionar idioma">
              <svg class="lang-selector__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              <span class="lang-selector__current">ES</span>
            </button>
          </div>
          <span class="co__secure">Pedido registrado</span>
        </div>
      </header>

      <div id="oc-content" class="co-summary-card">
        <p>Cargando confirmación…</p>
      </div>
    </main>

    <script src="js/language-switcher.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/policies.js" defer></script>
    <script>
      /**
       * La confirmación lee el pedido del servidor, no de sessionStorage.
       * La referencia por sí sola no basta: hace falta el token de acceso que
       * el servidor emitió al crear el pedido, para que nadie pueda enumerar
       * referencias ajenas y leer datos personales de otros clientes.
       */
      document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('oc-content');
        const params = new URLSearchParams(window.location.search);
        const reference = params.get('ref');
        const accessToken = params.get('t');

        const money = (cents, currency) =>
          new Intl.NumberFormat('es-DO', {
            style: 'currency',
            currency: currency || 'USD',
            minimumFractionDigits: 2,
          }).format((Number(cents) || 0) / 100);

        const safe = (value) => {
          const div = document.createElement('div');
          div.textContent = value == null ? '' : String(value);
          return div.innerHTML;
        };

        function notFound(message) {
          container.innerHTML = `
            <h1>No encontramos ese pedido</h1>
            <p>${safe(message)}</p>
            <a href="index.html" class="co-btn co-btn--gold">Volver al inicio</a>`;
        }

        if (!reference || !accessToken) {
          notFound('El enlace de confirmación está incompleto. Revisa el correo que te enviamos.');
          return;
        }

        let order;
        try {
          const response = await fetch(
            `/api/commerce/orders/${encodeURIComponent(reference)}?t=${encodeURIComponent(accessToken)}`
          );
          if (!response.ok) throw new Error('no disponible');
          order = await response.json();
        } catch {
          notFound(
            'No pudimos recuperar los detalles ahora mismo. Si completaste el pago, revisa tu correo o escríbenos por WhatsApp con tu referencia.'
          );
          return;
        }

        const isBank = order.paymentMethod === 'bank_transfer';
        const isPaid = order.paymentStatus === 'paid';

        const items = order.items
          .map(
            (item) =>
              `<li><strong>${safe(item.name)}</strong> — ${safe(item.displayLabel)} · ${money(item.lineTotalCents, order.currency)}</li>`
          )
          .join('');

        const bank = order.bankTransfer
          ? `
          <div class="co-bank">
            <h2>Transferencia</h2>
            <p class="co-note">
              Concepto: <strong>${safe(order.reference)}</strong>
              · Monto: <strong>${money(order.totalCents, order.currency)}</strong>
            </p>
            <div class="co-bank__region">
              <h3 class="co-bank__region-title">Cuentas</h3>
              ${(order.bankTransfer.accounts || [])
                .map(
                  (account) => `
                <div class="co-bank__account">
                  <p class="co-bank__bank">${safe(account.bankName)}</p>
                  <dl>
                    <div><dt>Titular</dt><dd>${safe(account.accountHolder)}</dd></div>
                    <div><dt>Tipo</dt><dd>${safe(account.accountType)}</dd></div>
                    <div><dt>Cuenta</dt><dd><code>${safe(account.accountNumber)}</code></dd></div>
                  </dl>
                </div>`
                )
                .join('')}
            </div>
            <a
              id="oc-bank-whatsapp"
              class="co-btn co-btn--whatsapp co-btn--block"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >Enviar comprobante por WhatsApp</a>
          </div>`
          : '';

        container.innerHTML = `
          <h1>${isPaid ? 'Pago confirmado' : isBank ? 'Pedido reservado — falta la transferencia' : 'Pedido registrado'}</h1>
          <p class="co-note">Referencia: <strong>${safe(order.reference)}</strong></p>

          <ul class="co-meta">
            <li><span>Estado</span><strong>${safe(order.status)}</strong></li>
            <li><span>Destino</span><strong>${safe(order.shipping.countryName)} · ${safe(order.shipping.city)}</strong></li>
            <li><span>Transportista</span><strong>${safe(order.shipping.carrier)}</strong></li>
            <li><span>Cajas</span><strong>${safe(order.shipping.boxes)}</strong></li>
            <li><span>Entrega estimada</span><strong>${safe(order.shipping.estimatedDays)} días</strong></li>
          </ul>

          <ul class="co-items">${items}</ul>

          <dl class="co-totals">
            <div><dt>Subtotal</dt><dd>${money(order.subtotalCents, order.currency)}</dd></div>
            <div><dt>Envío DHL</dt><dd>${money(order.shippingCents, order.currency)}</dd></div>
            <div class="co-totals__grand"><dt>Total</dt><dd>${money(order.totalCents, order.currency)}</dd></div>
          </dl>

          ${bank}

          <div class="co-warn" role="note">
            <strong>Venta final — sin devoluciones ni reembolsos.</strong>
            <p>${safe(typeof SALES_POLICY !== 'undefined' ? SALES_POLICY.legalNotice : '')}</p>
          </div>

          <div class="co-submit">
            ${
              isBank
                ? ''
                : `<button type="button" id="oc-whatsapp" class="co-btn co-btn--gold co-btn--block">Escribirnos por WhatsApp</button>`
            }
            <a href="index.html" class="co-btn co-btn--ghost co-btn--block">Seguir comprando</a>
          </div>`;

        const phone =
          (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.whatsapp && APP_CONFIG.whatsapp.phone) ||
          '18094645016';
        const waText = [
          `Pedido ${order.reference}`,
          `Total: ${money(order.totalCents, order.currency)}`,
          isBank ? 'Adjunto el comprobante de la transferencia bancaria.' : '',
        ]
          .filter(Boolean)
          .join('\n');
        const waUrl = `https://wa.me/${String(phone).replace(/\D/g, '')}?text=${encodeURIComponent(waText)}`;

        const bankWa = document.getElementById('oc-bank-whatsapp');
        if (bankWa) bankWa.href = waUrl;

        const genericWa = document.getElementById('oc-whatsapp');
        if (genericWa) {
          genericWa.addEventListener('click', () => {
            window.open(waUrl, '_blank', 'noopener');
          });
        }
      });
    </script>
  </body>
</html>
