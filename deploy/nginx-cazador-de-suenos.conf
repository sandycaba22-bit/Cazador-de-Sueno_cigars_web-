# Cazador de Sueños Cigars — Nginx Production
# Archivo: /etc/nginx/sites-available/cazador-de-suenos

# Redirigir HTTP sin www → HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name cazadordesuenocigars.com;
    return 301 https://www.cazadordesuenocigars.com$request_uri;
}

# Redirigir HTTP www → HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name www.cazadordesuenocigars.com;
    return 301 https://www.cazadordesuenocigars.com$request_uri;
}

# Redirigir HTTPS sin www → HTTPS www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cazadordesuenocigars.com;

    ssl_certificate     /etc/letsencrypt/live/www.cazadordesuenocigars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cazadordesuenocigars.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.cazadordesuenocigars.com$request_uri;
}

# Sitio canónico — www HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cazadordesuenocigars.com;

    root /var/www/cazador-de-suenos-cigars;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/www.cazadordesuenocigars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cazadordesuenocigars.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Caché estático
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sitio estático
    location / {
        try_files $uri $uri/ =404;
    }

    # Sin listado de directorios
    autoindex off;

    # Logs
    access_log /var/log/nginx/cazador-access.log;
    error_log  /var/log/nginx/cazador-error.log;
}
