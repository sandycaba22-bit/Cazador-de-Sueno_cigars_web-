# Cazador de Sueño Cigars SRL — Nginx Production
# Archivo: /etc/nginx/sites-available/cazador-de-suenos

# Redirigir HTTP sin www → HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name cazadordesuenocigars.com;
    return 301 https://www.cazadordesuenocigars.com$request_uri;
}

# Redirigir HTTP www → HTTPS www
server {
    listen 80;
    listen [::]:80;
    server_name www.cazadordesuenocigars.com;
    return 301 https://www.cazadordesuenocigars.com$request_uri;
}

# Redirigir HTTPS sin www → HTTPS www
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cazadordesuenocigars.com;

    ssl_certificate     /etc/letsencrypt/live/www.cazadordesuenocigars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cazadordesuenocigars.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.cazadordesuenocigars.com$request_uri;
}

# Sitio canónico — www HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cazadordesuenocigars.com;

    root /var/www/cazador-de-suenos-cigars;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/www.cazadordesuenocigars.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cazadordesuenocigars.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Seguridad básica
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------
    # Rutas que nunca deben servirse como ficheros estáticos.
    #
    # /data/ es crítico: ahí vivían los pedidos con nombre, correo, teléfono y
    # dirección de cada cliente, y al estar bajo el root eran descargables con
    # una simple petición GET. El almacén ya se movió a /var/lib, pero el bloqueo
    # se queda para que un despliegue antiguo no vuelva a exponerlos.
    # ------------------------------------------------------------------
    location ^~ /data/ {
        deny all;
        return 404;
    }

    location ^~ /server/ {
        deny all;
        return 404;
    }

    location ^~ /deploy/ {
        deny all;
        return 404;
    }

    location ^~ /node_modules/ {
        deny all;
        return 404;
    }

    location ~* ^/(package(-lock)?\.json|\.git|\.commerce-data)/? {
        deny all;
        return 404;
    }

    location ~ /\.env {
        deny all;
        return 404;
    }

    # API de comercio (cotización, pedidos, CardNET) — proceso Node local
    location /api/commerce {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # El pago debe poder tardar: CardNET añade 3D Secure y el emisor puede
        # ser lento. Cortar aquí produciría cargos huérfanos.
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        proxy_buffering off;
        proxy_cache off;
    }

    # Endpoints del servidor Express anterior. Ya no existen: se responde 410
    # para que quede claro en los logs si algún cliente cacheado los invoca.
    location ~ ^/api/(orders|create-payment-intent|stripe-webhook) {
        return 410;
    }

    # Sommelier IA (Gemini) — proxy al proceso Node local
    location /api/ai-sommelier {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering "no" always;
    }

    # Caché estático
    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sitio estático
    location / {
        try_files $uri $uri/ =404;
    }

    # Sin listado de directorios
    autoindex off;

    # Logs
    access_log /var/log/nginx/cazador-access.log;
    error_log  /var/log/nginx/cazador-error.log;
}
