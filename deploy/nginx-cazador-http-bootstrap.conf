# Bootstrap HTTP — usar ANTES de Certbot (sin certificados SSL aún)
# Archivo: /etc/nginx/sites-available/cazador-de-suenos

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name cazadordesuenocigars.com www.cazadordesuenocigars.com _;

    root /var/www/cazador-de-suenos-cigars;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location ^~ /server/ {
        deny all;
        return 404;
    }

    location ~ /\.env {
        deny all;
        return 404;
    }

    location /api/ai-sommelier {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        add_header X-Accel-Buffering "no" always;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|ico|css|js|pdf|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    autoindex off;

    access_log /var/log/nginx/cazador-access.log;
    error_log  /var/log/nginx/cazador-error.log;
}
