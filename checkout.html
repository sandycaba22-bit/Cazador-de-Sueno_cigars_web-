<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Checkout seguro — Cazador de Sueños Cigars" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Finalizar compra — Cazador de Sueños</title>

    <script>
      (function () {
        if (window.__cdsEarlyStyle) {
          window.__cdsEarlyStyle.remove();
          delete window.__cdsEarlyStyle;
        }
        document.documentElement.style.visibility = 'visible';
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/luxury-tokens.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/checkout-onepage.css" />
  </head>

  <body data-page="checkout">
    <main class="co" id="co-root">
      <header class="co__bar">
        <a class="co__back" href="index.html">← Seguir comprando</a>
        <a href="index.html" class="cds-brand co__brand" aria-label="Cazador de Sueños Cigar SRL">
          <img
            src="images/logo.png"
            alt="Cazador de Sueños"
            class="cds-brand__mark site-logo site-logo--compact"
            width="339"
            height="256"
            decoding="async"
          />
        </a>
        <div class="nav__tools">
          <div class="lang-selector">
            <button type="button" class="lang-selector__button" aria-label="Seleccionar idioma">
              <svg class="lang-selector__icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20"/>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
              </svg>
              <span class="lang-selector__current">ES</span>
            </button>
          </div>
          <span class="co__secure" aria-label="Conexión segura">Pago seguro</span>
        </div>
      </header>

      <div id="co-alert" class="co__alert" role="alert" hidden></div>

      <section id="co-empty" class="co__empty" hidden>
        <h1>Tu carrito está vacío</h1>
        <a class="co-btn co-btn--gold" href="index.html#catalogo">Ver catálogo</a>
      </section>

      <div id="co-layout" class="co__layout" hidden>
        <form id="co-form" class="co__form co__form--compact" novalidate autocomplete="on">
          <h1 class="co__title">Checkout</h1>

          <section class="co-block co-block--compact">
            <h2 class="co-block__title">Datos</h2>
            <div class="co-grid">
              <label class="co-field co-field--wide">
                <span>Nombre</span>
                <input type="text" name="fullName" autocomplete="name" required />
              </label>
              <label class="co-field">
                <span>Correo</span>
                <input type="email" name="email" autocomplete="email" inputmode="email" required />
              </label>
              <label class="co-field">
                <span>Teléfono</span>
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" required />
              </label>
              <label class="co-field">
                <span>País</span>
                <select name="country" required></select>
              </label>
              <label class="co-field">
                <span>Ciudad</span>
                <input type="text" name="city" autocomplete="address-level2" required />
              </label>
              <label class="co-field co-field--wide">
                <span>Dirección</span>
                <input type="text" name="address" autocomplete="street-address" required />
              </label>
            </div>
            <details class="co-optional">
              <summary>Más (estado, C.P., notas)</summary>
              <div class="co-grid">
                <label class="co-field">
                  <span>Estado</span>
                  <input type="text" name="state" autocomplete="address-level1" />
                </label>
                <label class="co-field">
                  <span>C.P.</span>
                  <input type="text" name="postalCode" autocomplete="postal-code" />
                </label>
                <label class="co-field co-field--wide">
                  <span>Notas</span>
                  <textarea name="notes" rows="2"></textarea>
                </label>
              </div>
            </details>
          </section>

          <section class="co-block co-block--compact">
            <h2 class="co-block__title">Pago</h2>
            <div id="co-methods" class="co-methods" role="radiogroup" aria-label="Método de pago">
              <p class="co-methods__loading">Cargando…</p>
            </div>
            <div id="co-method-detail" class="co-method-detail" hidden></div>
          </section>

          <section class="co-block co-block--legal co-block--compact">
            <label class="co-check co-check--single">
              <input type="checkbox" name="acceptTerms" />
              <span id="co-policy-terms">
                Acepto venta final (sin devoluciones) y la responsabilidad aduanera en destino.
              </span>
            </label>
          </section>

          <div class="co-submit">
            <button type="submit" id="co-submit" class="co-btn co-btn--gold co-btn--block" disabled>
              Confirmar pedido
            </button>
          </div>
        </form>

        <aside class="co__summary" aria-label="Resumen del pedido">
          <div class="co-summary-card">
            <h2>Pedido</h2>
            <div id="co-items" class="co-items"></div>
            <dl class="co-totals">
              <div>
                <dt>Subtotal</dt>
                <dd id="co-subtotal">—</dd>
              </div>
              <div>
                <dt>Envío <span id="co-zone" class="co-totals__zone"></span></dt>
                <dd id="co-shipping">—</dd>
              </div>
              <div class="co-totals__grand">
                <dt>Total</dt>
                <dd id="co-total">—</dd>
              </div>
            </dl>
            <p id="co-boxes-warning" class="co-warn" role="alert" hidden></p>
            <ul class="co-meta">
              <li><span>Puros</span><strong id="co-units">0</strong></li>
              <li><span>Cajas</span><strong id="co-boxes">0</strong></li>
              <li><span>Entrega</span><strong id="co-eta">—</strong></li>
            </ul>
          </div>
        </aside>
      </div>
    </main>

    <script src="js/page-visibility.js" defer></script>
    <script src="js/language-switcher.js" defer></script>
    <script src="js/config.js" defer></script>
    <script src="js/policies.js" defer></script>
    <script src="js/catalog.js" defer></script>
    <script src="js/shipping.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/cart-legacy-bridge.js" defer></script>
    <script src="js/cart.js" defer></script>
    <script src="js/checkout.js" defer></script>
  </body>
</html>
